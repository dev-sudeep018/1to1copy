    <style>
      #tcmg-loader-wrapper {
        position: fixed;
        inset: 0;
        background-color: #000;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #tcmg-loader-wrap {
        position: relative;
        display: inline-block;
      }
      #tcmg-loader {
        filter: blur(20px);
        outline: none;
        object-fit: contain;
      }
      #tcmg-loader-caption {
        position: absolute;
        top: 10%;
        left: 0;
        z-index: 1001;
        padding: 12px 16px;
        color: #30383e;
        line-height: 1.4;
        max-width: 240px;
        opacity: 0;
      }
      #tcmg-loader-text {
        opacity: 0;
        color: #566e7f;
        position: fixed;
        top: auto;
        bottom: 10%;
        z-index: 1001;
        max-width: 400px;
      }
      .tcmg-highlight {
        color: #7f9eb3;
      }
      #tcmg-loader-percentage {
        color: #d9eaf5;
      }
      #enter-cta {
        margin-top: 48px;
        padding: 14px 48px;
        background-color: transparent;
        color: #d9eaf5;
        position: relative;
        cursor: pointer;
        letter-spacing: 0.1em;
        transition: opacity 1s ease;
      }
      #enter-cta:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #enter-cta span {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.1);
        transition: background-color 0.3s ease;
      }
      #enter-cta:not(:disabled):hover span {
        background-color: rgba(255, 255, 255, 0.3);
      }
      #enter-cta span:nth-child(1) {
        top: 0;
        left: 0;
        width: 100%;
        height: 1px;
      }
      #enter-cta span:nth-child(2) {
        top: 0;
        left: auto;
        right: 0;
        width: 1px;
        height: 100%;
      }
      #enter-cta span:nth-child(3) {
        top: auto;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 1px;
      }
      #enter-cta span:nth-child(4) {
        top: 0;
        left: 0;
        width: 1px;
        height: 100%;
      }

      #enter-cta span:before {
        top: 0;
        left: 0;
        width: 2px;
        height: 2px;
        background-color: white;
        content: "";
        position: absolute;
      }
      #enter-cta span:nth-child(3):before {
        left: auto;
        right: 0;
      }
      #enter-cta span:nth-child(4):before {
        top: auto;
        bottom: 0;
      }
      @media (max-width: 768px) {
        #tcmg-loader-text {
          left: 32px;
          right: 32px;
          width: auto;
          max-width: none;
          font-size: 14px;
        }
        #tcmg-loader-caption {
          top: 0;
          font-size: 14px;
        }
      }
      @media (orientation: portrait) and (min-width: 769px) {
        #tcmg-loader {
          width: 100vw;
          height: auto;
        }
        #tcmg-loader-text {
          right: 0;
        }
      }
      @media (orientation: landscape) {
        #tcmg-loader {
          width: auto;
          height: 100vh;
        }
        #tcmg-loader-text {
          right: calc(50% - 50vh);
        }
      }
    </style>
